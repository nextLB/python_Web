<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #764ba2;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .messages {
            margin-bottom: 20px;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <style>
    /* 粒子效果 */
    .particle {
        position: fixed;
        pointer-events: none;
        border-radius: 50%;
        z-index: 9999;
        animation: particleFloat 1s ease-out forwards;
    }

    @keyframes particleFloat {
        0% {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }
        100% {
            opacity: 0;
            transform: translate(var(--tx), var(--ty)) scale(0);
        }
    }
    </style>

    <script>
    // 高级粒子效果
    document.addEventListener('mousemove', function(e) {
        createParticles(e.clientX, e.clientY, 3);
    });

    document.addEventListener('click', function(e) {
        createParticles(e.clientX, e.clientY, 15);
    });

    function createParticles(x, y, count) {
        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 8 + 2;
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 50 + 20;

            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = (x - size/2) + 'px';
            particle.style.top = (y - size/2) + 'px';

            // 随机颜色
            const colors = ['#667eea', '#764ba2', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];

            // 随机运动方向
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');

            // 随机动画时长
            const duration = Math.random() * 0.5 + 0.5;
            particle.style.animationDuration = duration + 's';

            document.body.appendChild(particle);

            // 自动移除
            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        }
    }

    // 按钮悬停效果
    document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.btn, .logout-btn, .back-btn, .select-btn');

        buttons.forEach(button => {
            button.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 8px 20px rgba(0,0,0,0.2)';
            });

            button.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = '0 5px 15px rgba(0,0,0,0.1)';
            });

            button.addEventListener('click', function(e) {
                // 创建按钮点击特效
                createParticles(e.clientX, e.clientY, 8);
            });
        });
    });
    </script>


    <div class="container">
        <h1>用户登录</h1>

        <!-- 显示消息 -->
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn">登录</button>

            <!-- 隐藏的next字段，用于登录后重定向 -->
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
        </form>

        <div class="links">
            <p>还没有账号？<a href="{% url 'register' %}">立即注册</a></p>
        </div>
    </div>
</body>
</html>

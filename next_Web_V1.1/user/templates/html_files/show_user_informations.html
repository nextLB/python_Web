<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Show User Informations</title>
</head>
<body>

    <!-- 显示数据库中的所有的用户信息 -->
    <h1>用户信息</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
        </tr>
        <!-- 遍历视图传递的dataList -->
        {% for item in dataList %}
        <tr>
            <td>{{ item.id }}</td>  <!-- 模型自动生成的id字段 -->
            <td>{{ item.name }}</td>  <!-- 名称字段 -->
            <td>{{ item.age }}</td>   <!-- 年龄字段 -->
            <td>{{ item.sex }}</td>   <!-- 性别字段 -->
        </tr>
        {% empty %}  <!-- 如果数据为空时显示 -->
        <tr>
            <td colspan="3">暂无数据</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
